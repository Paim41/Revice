name: revice_android
description: Revice local Android monitoring foundation.
publish_to: none
version: 0.2.4+6
environment:
  sdk: ^3.13.5
dependencies:
  native_monitoring:
    path: ../../../packages/native_monitoring
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_database: ^13.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path: ^1.9.1
  sqflite: ^2.4.4+2
  workmanager: ^0.10.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/revice-app-icon.png
    - assets/revice-header-logo.png
