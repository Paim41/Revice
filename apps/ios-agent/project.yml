name: ReviceAgent
options:
  bundleIdPrefix: app.revice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ReviceAgent:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - Security
      - ViewModels
      - Views
      - path: Resources
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.revice.ios-agent
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ReviceAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ReviceAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.revice.ios-agent.tests
  ReviceAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ReviceAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.revice.ios-agent.uitests
schemes:
  ReviceAgent:
    build:
      targets:
        ReviceAgent: all
    test:
      targets: [ReviceAgentTests, ReviceAgentUITests]
